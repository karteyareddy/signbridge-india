<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title description">
  <title id="title">ISL video placeholder</title>
  <desc id="description">A calm dark background indicating where a validated ISL video appears.</desc>
  <defs><linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#312e81"/></linearGradient></defs>
  <rect width="960" height="540" fill="url(#background)"/>
  <circle cx="480" cy="230" r="72" fill="none" stroke="#5eead4" stroke-width="10"/>
  <path d="M462 190l58 40-58 40z" fill="#5eead4"/>
  <text x="480" y="360" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="34" font-weight="700">Validated ISL media</text>
  <text x="480" y="405" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="22">Video status will appear here</text>
</svg>
